<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼豆工作室</title>
    <!-- 防閃爍：React 載入前先依偏好設好 data-theme；key 與規則要和 src/web/lib/theme.ts 一致 -->
    <script>
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('bead-studio.theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
